const ST={a:'Tất cả',l:'Lý thuyết',c:'Tính toán'};

const LS=[
['🏃','Tốc độ chuyển động',7,`<ul><li><b>Tốc độ</b> cho biết vật chuyển động nhanh hay chậm: <b>v = s / t</b> (s: quãng đường, t: thời gian).</li><li>Đơn vị: m/s hoặc km/h. <b>1 m/s = 3,6 km/h</b>.</li><li>Tốc độ trung bình = tổng quãng đường / tổng thời gian.</li></ul><p class="tip">💡 Đổi km/h sang m/s thì chia 3,6; đổi m/s sang km/h thì nhân 3,6.</p>`],
['📈','Đồ thị quãng đường – thời gian',7,`<ul><li>Chuyển động đều có đồ thị là <b>đường thẳng đi lên</b> từ gốc toạ độ.</li><li>Đường càng dốc thì vật càng nhanh (tốc độ là độ dốc).</li><li>Đoạn nằm ngang: vật đứng yên.</li></ul><p class="tip">💡 Từ đồ thị, lấy quãng đường chia thời gian tương ứng để tìm tốc độ.</p>`],
['🔊','Âm thanh',7,`<ul><li>Âm do vật <b>dao động</b> phát ra. <b>Tần số</b> (Hz) càng lớn thì âm càng cao (bổng).</li><li><b>Biên độ</b> dao động càng lớn thì âm càng to (đo bằng dB).</li><li>Âm truyền qua chất rắn, lỏng, khí, <b>không truyền trong chân không</b>. Âm truyền trong rắn nhanh hơn lỏng, lỏng nhanh hơn khí.</li><li>Tiếng vang: âm phản xạ nghe cách âm trực tiếp ít nhất 1/15 giây.</li></ul>`],
['💡','Ánh sáng và gương phẳng',7,`<ul><li>Ánh sáng truyền theo đường thẳng trong môi trường trong suốt, đồng tính.</li><li><b>Định luật phản xạ:</b> tia phản xạ nằm trong mặt phẳng tới, <b>góc phản xạ = góc tới</b>.</li><li>Ảnh qua gương phẳng là <b>ảnh ảo</b>, bằng vật, cách gương một khoảng bằng khoảng cách từ vật tới gương.</li></ul><p class="tip">💡 Góc tới và góc phản xạ đo từ tia đến <b>pháp tuyến</b>, không đo từ mặt gương.</p>`],
['🧲','Từ trường',7,`<ul><li>Nam châm có hai cực: Bắc (N) và Nam (S). <b>Cùng cực đẩy nhau, khác cực hút nhau</b>.</li><li>Xung quanh nam châm có từ trường, biểu diễn bằng đường sức từ (đi ra từ cực N, đi vào cực S).</li><li>Kim la bàn luôn chỉ hướng Bắc – Nam vì Trái Đất là một nam châm lớn.</li></ul>`],
['⚖️','Khối lượng riêng và áp suất',8,`<ul><li><b>Khối lượng riêng D = m / V</b> (kg/m³). Trọng lượng riêng d = 10·D (N/m³).</li><li><b>Áp suất p = F / S</b> (Pa = N/m²). Diện tích tiếp xúc càng nhỏ, áp suất càng lớn.</li><li><b>Áp suất chất lỏng p = d·h</b>: càng sâu, áp suất càng lớn.</li></ul><p class="tip">💡 Dao sắc cắt dễ vì diện tích lưỡi nhỏ nên áp suất lớn.</p>`],
['🛟','Lực đẩy Ác-si-mét',8,`<ul><li>Vật nhúng trong chất lỏng chịu lực đẩy hướng lên: <b>F = d·V</b> (d: trọng lượng riêng chất lỏng, V: thể tích phần chìm).</li><li>Trọng lượng P &gt; F: <b>chìm</b>. P = F: <b>lơ lửng</b>. P &lt; F: <b>nổi</b>.</li><li>Vật đặc nổi khi khối lượng riêng nhỏ hơn chất lỏng.</li></ul><p class="tip">💡 Thử mô phỏng "Nổi hay chìm?" ở tab Mô phỏng.</p>`],
['🏗️','Công và công suất',8,`<ul><li><b>Công A = F·s</b> (J), khi lực cùng hướng chuyển động.</li><li><b>Công suất P = A / t</b> (W): công thực hiện trong một giây.</li><li>Máy cơ đơn giản (đòn bẩy, ròng rọc) cho lợi về lực nhưng <b>không cho lợi về công</b>.</li><li>Hiệu suất H = A có ích / A toàn phần × 100%.</li></ul>`],
['🔥','Nhiệt lượng',8,`<ul><li><b>Q = m·c·Δt</b> (J). Nhiệt dung riêng của nước c = 4200 J/kg.K.</li><li>Ba cách truyền nhiệt: dẫn nhiệt (chất rắn), đối lưu (chất lỏng, khí), bức xạ nhiệt.</li><li>Cân bằng nhiệt: <b>nhiệt toả ra = nhiệt thu vào</b>.</li></ul>`],

function qz(){const el=$('#quiz');
if(!qrun){el.innerHTML=`<h3>Luyện tập ngẫu nhiên 🎲</h3><p class="hint">Mỗi lần bấm Bắt đầu, câu hỏi và thứ tự đáp án đều được xáo trộn. Câu tính toán tự sinh số liệu mới nên không bao giờ trùng.</p><b>Chủ đề</b><div class="chips" id="qc"></div><p style="margin:8px 0 4px"><b>Số câu</b></p><div class="chips" id="qn"></div><div class="row"><button class="btn" id="go">Bắt đầu 🚀</button></div><p class="hint">Kho hiện có ${Q.length} câu soạn sẵn và không giới hạn câu tính toán tự sinh.</p>`;
chp('#qc',Object.entries(ST),()=>qt,k=>qt=k);chp('#qn',[[10,'10 câu'],[20,'20 câu'],[30,'30 câu']],()=>qn,k=>qn=+k);$('#go').onclick=begin;return}
if(qi>=qs.length){const b=Math.max(best(qt),sc);best(qt,b);
el.innerHTML=`<h3>Bạn đúng ${sc}/${qs.length} câu</h3><p>${sc==qs.length?'Tuyệt vời, nhà hoá học thực thụ! 🏆':sc>=qs.length*.7?'Khá lắm! Ôn thêm chút nữa là hoàn hảo.':'Đừng nản, xem lại bài học rồi thử bộ câu khác nhé.'}</p><p class="hint">Điểm cao nhất ở chủ đề ${ST[qt]}: ${b}</p><div class="row"><button class="btn" id="ag">Bộ câu khác 🔀</button><button class="btn alt" id="bk2">Đổi chủ đề</button></div>`;
if(sc==qs.length)spawn('🎉',10);const pct=sc/qs.length*100;
save('quiz-'+qt,sc,qs.length,!!P.get('quiz')&&pct>=PASS).then(m=>{if(qi>=qs.length&&qrun)el.insertAdjacentHTML('beforeend',`<p class="hint">${esc(m)}${P.get('quiz')&&pct<PASS?` Cần đạt ${PASS}% để hoàn thành bài được giao. Thử bộ câu khác nhé!`:''}</p>`)});$('#ag').onclick=begin;$('#bk2').onclick=()=>{qrun=false;qz()};return}
const q=qs[qi];el.innerHTML=`<div class="bar"><i style="width:${qi/qs.length*100}%"></i></div><p class="hint">${ST[qt]} – câu ${qi+1}/${qs.length}</p><h3>${sub(q[1])}</h3>`+q[2].map((o,i)=>[o,i]).sort(()=>Math.random()-.5).map(([o,i])=>`<button class="opt" data-i="${i}">${sub(o)}</button>`).join('')+'<div id="fb"></div>';
el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===q[3])x.classList.add('ok')});
if(i===q[3]){sc++;spawn('⭐',5)}else b.classList.add('no');
$('#fb').innerHTML=`<div class="why"><b>${i===q[3]?'Chính xác! 🎉':'Chưa đúng 😅'}</b> ${sub(q[4])}</div><div class="row"><button class="btn" id="nx">${qi==qs.length-1?'Xem kết quả':'Câu tiếp'}</button></div>`;
$('#nx').onclick=()=>{qi++;qz()}})}

function begin(){const S=shuf(Q),l=[],seen=new Set();let tr=0;
while(l.length<qn&&tr++<qn*8){const t=qt=='a'?(Math.random()<.5?'l':'c'):qt;
const q=(t=='l'&&S.length)?S.pop():rnd(GC)();if(seen.has(q[1]))continue;seen.add(q[1]);l.push(q)}
qs=l;qi=0;sc=0;qrun=true;qz()}
function assigned(){const b=+P.get('bai'),k=P.get('kn'),q=P.get('quiz'),a=$('#asg'),go=t=>document.querySelector(`nav [data-t=${t}]`).click(),
dn=id=>`<div class="row"><button class="btn" onclick="finish(this,'${id}')">✅ Mình đã học xong</button></div><p class="hint"></p>`,
bn=t=>{a.style.display='block';a.innerHTML='📌 <b>Bài được giao:</b> '+t};
if(b&&LS[b-1]){bn(`Bài ${b}. ${esc(LS[b-1][1])}`);const d=$('#les').querySelectorAll('details')[b-1];d.open=true;d.insertAdjacentHTML('beforeend',dn('bai-'+b));go('t0');setTimeout(()=>d.scrollIntoView(),60)}
else if(k&&k.length==1&&'ABCDE'.includes(k)){const i='ABCDE'.indexOf(k),d=[...$('#sk').children].filter(x=>x.tagName=='DETAILS')[i];bn(`${'ABCDE'[i]}. ${SKL[i]}`);d.open=true;d.insertAdjacentHTML('beforeend',dn('kn-'+k));go('t2');setTimeout(()=>d.scrollIntoView(),60)}
else if(q&&ST[q]){qt=q;qn=+P.get('n')||10;bn(`làm ${qn} câu ${ST[q]}, cần đạt ${PASS}% để hoàn thành.`);go('t3');begin()}}
function topicName(t){t=t.replace('ly:','');const [k,v]=t.split('-');return k=='bai'?'Bài '+v+(LS[v-1]?': '+LS[v-1][1]:''):k=='kn'?v+'. '+(SKL['ABCDE'.indexOf(v)]||''):'Luyện '+(ST[v]||v)}
async function rs(){const el=$('#rs');
if(!sb||!ME){el.innerHTML='<h3>Kết quả</h3><p class="hint">Đăng nhập (qua Việc nhà) để xem kết quả của cả nhà.</p>';return}
el.innerHTML='<p class="hint">Đang tải…</p>';
try{const {data,error}=await sb.from('hoa_results').select('*').like('topic','ly:%').order('created_at',{ascending:false}).limit(40);if(error)throw error;
el.innerHTML='<h3>Kết quả gần đây</h3>'+((data||[]).map(r=>`<p style="margin:8px 0"><b>${esc(MEM[r.user_id]||'Ai đó')}</b> · ${esc(topicName(r.topic))}${r.total?` · <b>${r.score}/${r.total}</b>`:' · ✅ đã học'}<br><span class="hint">${new Date(r.created_at).toLocaleString('vi-VN')}</span></p>`).join('')||'<p class="hint">Chưa có kết quả nào.</p>')}catch(e){el.innerHTML='<p class="hint">Không tải được: '+esc(e.message)+'</p>'}}
document.querySelector('[data-t=t4]').addEventListener('click',rs);
qz();assigned();acct();
</script></body></html>
